# 10.74M-parameter preset (width 384 x 6 layers).
# With mixed_precision and compile on an M3 Pro, MLX measured ~47.8k bytes/s (~3.5 GB peak GPU memory).
# Step counts in these comments use the PyTorch port's ~45k bytes/s (../v0):
# ~69k steps in 7h (~1.14B bytes, ~107 bytes/param).
# For larger models, see configs/14m.toml and configs/19m.toml.

[model]
context_length = 512      # ~90-100 English words per window
width = 384               # 64 dims per head
heads = 6
ff_width = 1536           # 4 * width
layers = 6
embedding_dropout = 0.0   # Streamed FineWeb-Edu does not repeat in 7h
residual_dropout = 0.0
attention_dropout = 0.0
attention_bias = false
ff_bias = true
activation = "gelu"
pre_norm = true           # More stable than post-norm at 6-8 layers without grad clipping
layer_norm_eps = 1e-6
position_base = 10000.0
scale_embeddings = true
tie_embeddings = true
init_scale = 0.5          # Keeps initial logit scale near 1 with pre_norm (no final LayerNorm)

[optimizer]
beta1 = 0.9
beta2 = 0.95              # Reacts faster to outlier web batches without grad clipping
epsilon = 1e-8
weight_decay = 0.0        # Coupled L2 (as in torch.optim.Adam), not AdamW
warmup_steps = 2000       # ~2.9% of ~69k steps in 7h
lr_multiplier = 0.7       # Peak LR = 8.0e-4 at step 2,000; ~1.4e-4 at step 69,000

[training]
hours = 7.0
batch_size = 32           # 16,384 bytes/step
label_smoothing = 0.0     # Avoids putting probability mass on invalid/control UTF-8 bytes
seed = 0
verbose = true
log_interval_seconds = 30.0
mixed_precision = true
compile = true            # First step compiles (~0.6 s)

[data]
subset = "sample-10BT"
revision = "main"

[runtime]
device = "auto"
checkpoint = "checkpoints/fineweb-v0-11m.safetensors"

[generation]
max_new_tokens = 400
temperature = 0.8
# seed = 123              # Uncomment for reproducible sampling on the same device
