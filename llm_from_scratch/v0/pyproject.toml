[project]
name = "fineweb-decoder-v0"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["datasets>=4.2", "pydantic>=2.10,<3", "torch>=2.5; sys_platform != 'linux'"]

[dependency-groups]
cpu = ["torch>=2.5; sys_platform == 'linux'"]
cuda = ["torch>=2.5; sys_platform == 'linux'"]

[tool.uv]
default-groups = ["cpu"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", group = "cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
