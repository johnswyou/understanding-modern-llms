# 10-hour FineWeb-Edu pretraining preset for Apple M3 Pro (18-core GPU, 36 GB RAM).
# ~10.74M parameters (~85-90 bytes/param over 10h, ~4.5-5 GB MPS memory).
# Set layers = 8 for a 14.28M-parameter variant (~50-55 bytes/param over 10h).

[model]
context_length = 512      # ~90-100 English words per window
width = 384               # 64 dims per head
heads = 6
ff_width = 1536           # 4 * width
layers = 6
embedding_dropout = 0.0   # Streamed FineWeb-Edu does not repeat in 10h
residual_dropout = 0.0
attention_dropout = 0.0
attention_bias = false
ff_bias = true
activation = "gelu"
pre_norm = true           # More stable than post-norm at 6-8 layers without grad clipping
layer_norm_eps = 1e-6
position_base = 10000.0
scale_embeddings = true
tie_embeddings = true
init_scale = 0.5          # Keeps initial logit scale near 1 with pre_norm (no final LayerNorm)

[optimizer]
beta1 = 0.9
beta2 = 0.95              # Reacts faster to outlier web batches without grad clipping
epsilon = 1e-8
weight_decay = 0.0        # torch.optim.Adam uses coupled L2, not AdamW
warmup_steps = 2000       # ~3.5% of ~57k steps in 10h
lr_multiplier = 0.7       # Peak LR = 8.0e-4 at step 2,000; ~1.5e-4 at step 57,000

[training]
hours = 7.0
batch_size = 32           # 16,384 bytes/step; saturates MPS at ~4.5-5 GB memory
label_smoothing = 0.0     # Avoids putting probability mass on invalid/control UTF-8 bytes
seed = 0
verbose = true
log_interval_seconds = 30.0

[data]
subset = "sample-10BT"
revision = "main"
workers = 2

[runtime]
device = "auto"
checkpoint = "checkpoints/fineweb-v0-11m.pt"

[generation]
max_new_tokens = 400
temperature = 0.8
# seed = 123              # Uncomment for reproducible sampling on the same device
