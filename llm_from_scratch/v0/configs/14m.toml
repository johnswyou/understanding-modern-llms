# 14.28M-parameter preset (width 384 x 8 layers).
# With mixed_precision and compile on an M3 Pro, measured ~34.5k bytes/s (~4.2 GB MPS memory):
# ~53k steps in 7h (~0.87B bytes, ~61 bytes/param) or ~106k steps in 14h (~1.74B bytes, ~122 bytes/param).
# Measure on your hardware: uv run benchmark_speed.py --config configs/14m.toml

[model]
context_length = 512      # ~90-100 English words per window
width = 384               # 64 dims per head
heads = 6
ff_width = 1536           # 4 * width
layers = 8
embedding_dropout = 0.0   # Streamed FineWeb-Edu does not repeat in 14h
residual_dropout = 0.0
attention_dropout = 0.0
attention_bias = false
ff_bias = true
activation = "gelu"
pre_norm = true
layer_norm_eps = 1e-6
position_base = 10000.0
scale_embeddings = true
tie_embeddings = true
init_scale = 0.5          # Keeps initial logit scale near 1 with pre_norm (no final LayerNorm)

[optimizer]
beta1 = 0.9
beta2 = 0.95
epsilon = 1e-8
weight_decay = 0.0        # torch.optim.Adam uses coupled L2, not AdamW
warmup_steps = 2500       # ~2.4% of an estimated ~105k steps in 14h
lr_multiplier = 0.7       # Peak LR = 7.1e-4 at step 2,500; ~1.1e-4 at step 105,000

[training]
hours = 14.0
batch_size = 32           # 16,384 bytes/step
label_smoothing = 0.0     # Avoids putting probability mass on invalid/control UTF-8 bytes
seed = 0
verbose = true
log_interval_seconds = 30.0
mixed_precision = true    # bfloat16 autocast on MPS
compile = true

[data]
subset = "sample-10BT"
revision = "main"
workers = 2

[runtime]
device = "auto"
checkpoint = "checkpoints/fineweb-v0-14m.pt"

[generation]
max_new_tokens = 400
temperature = 0.8
# seed = 123              # Uncomment for reproducible sampling on the same device